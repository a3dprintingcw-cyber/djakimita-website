# Hidden preview of the new djakimita.com on our own server.
services:
  djk-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: djk_stage
      MARIADB_USER: djk
      MARIADB_PASSWORD: ${DJK_DB_PASS}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: --max-allowed-packet=256M
    volumes:
      - djk_db:/var/lib/mysql
    networks: [sss]

  djk-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on: [djk-db]
    volumes:
      - ../app/config.local.php:/var/www/site/app/config.local.php:ro
      - djk_storage:/var/www/site/app/storage
    networks: [sss]

volumes:
  djk_db:
  djk_storage:

networks:
  sss:
    external: true
    name: sss_default
